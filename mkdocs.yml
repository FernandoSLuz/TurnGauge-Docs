site_name: TurnGauge
site_description: >-
  Deterministic, replayable turn and tempo battles for Unity. Action-order or ATB
  scheduling, formations, statuses, reactions, AI policies, a Monte Carlo balancing
  workbench, and a skinnable battle interface.
site_url: https://fernandosluz.github.io/TurnGauge-Docs/
# Defaults log these at INFO, which --strict does not fail on: a page dropped from the
# nav or a broken #anchor would pass a green strict build. Promoted to warnings so the
# build actually enforces what it appears to.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

repo_url: https://github.com/FernandoSLuz/TurnGauge-Docs
repo_name: TurnGauge-Docs
edit_uri: edit/rename/turngauge/docs/
copyright: Copyright &copy; Fernando Silva da Luz

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    # Slate Nocturne is the shipped default style, so the docs default to dark too.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github
    admonition:
      tip: material/rocket-launch
      warning: material/alert-outline

plugins:
  - search:
      separator: '[\s\-\.\_]+'
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols

extra_css:
  - assets/css/extra.css
  - assets/css/native-layout-comparison.css

extra_javascript:
  - assets/js/api-filter.js
  - assets/js/native-layout-comparison.js
  - assets/js/studio-video.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FernandoSLuz/TurnGauge-Docs
      name: TurnGauge docs on GitHub

nav:
  - Home: index.md
  - Tutorials:
      - 1. Install and run the demo: tutorials/first-battle.md
      - 2. Build your combat without code: tutorials/build-without-code.md
      - 3. Put a battle in your scene: tutorials/playable-battle-in-a-scene.md
      - 4. Run a battle from your own code: tutorials/run-a-battle-from-code.md
      - 5. Draw the battle on screen: tutorials/show-the-battle.md
      - 6. Take a decision from the player: tutorials/take-player-input.md
      - 7. Restyle the interface: tutorials/skinning-your-battle.md
      - 8. Explore Combat Studio: tutorials/combat-studio.md
      - 9. Add custom mechanics: tutorials/custom-mechanics.md
  - How-to:
      - Start from a battle template: how-to/start-from-a-template.md
      - Author content in the right order: how-to/author-content.md
      - Effects and statuses: how-to/author-effects-and-statuses.md
      - Skills, targets and timing: how-to/author-skills-and-targets.md
      - Combatants, teams and encounters: how-to/author-combatants-and-encounters.md
      - Place combatants with the Formation Editor: how-to/place-formations.md
      - What each interface region draws: how-to/interface-regions.md
      - Palette and surfaces: how-to/skin-surfaces.md
      - Bars, gauges and pips: how-to/skin-bars-and-pips.md
      - Fit the battle to your screen: how-to/interface-layout.md
      - Compare native HUD layouts: how-to/compare-native-layouts.md
      - Turn events into visuals: how-to/presentation-recipes.md
      - Shape the perform moment: how-to/the-perform-moment.md
      - Use your own character art: how-to/use-your-own-art.md
      - Step a battle in the Workbench: how-to/balance-with-the-workbench.md
      - Run Monte Carlo batches: how-to/monte-carlo-batches.md
      - Record and replay a battle: how-to/record-and-replay.md
      - Troubleshooting: how-to/troubleshooting.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - The engine loop: explanation/engine-loop.md
      - Schedulers and tempo: explanation/schedulers.md
      - Determinism: explanation/determinism.md
  - API reference:
      - Overview: reference/index.md
      - The runtime facade: reference/the-runtime-facade.md
      - Running a battle: reference/running-a-battle.md
      - Commands, events and snapshots: reference/commands-events-and-snapshots.md
      - Scheduling and tempo: reference/scheduling-and-tempo.md
      - Effects and mechanics: reference/effects-and-mechanics.md
      - Statuses, targeting and reactions: reference/statuses-targeting-and-reactions.md
      - AI policies: reference/ai-policies.md
      - Authoring definitions: reference/authoring-definitions.md
      - Compiling and validating content: reference/compiling-and-validating-content.md
      - Formations: reference/formations.md
      - Skinning and appearance: reference/skinning-and-appearance.md
      - Interface and widgets: reference/interface-and-widgets.md
      - Stage and tokens: reference/stage-and-tokens.md
      - The perform moment: reference/the-perform-moment.md
      - Presentation adapters and recipes: reference/presentation-adapters-and-recipes.md
      - Replay: reference/replay.md
      - Analysis and balancing: reference/analysis-and-balancing.md
      - Numerics and determinism: reference/numerics-and-determinism.md
      - Editor tools: reference/editor-tools.md
      - Other: reference/other.md
      - Documentation coverage: reference/coverage.md
